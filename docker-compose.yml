version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cc_fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc_react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped